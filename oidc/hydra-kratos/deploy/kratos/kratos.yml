version: v1.3.1

dsn: postgres://kratos:kratos@kratos-postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3000
  admin:
    base_url: http://localhost:4434/

selfservice:
  default_browser_return_url: http://localhost:3000/
  allowed_return_urls:
    - http://localhost:3000

  methods:
    password:
      enabled: true

  flows:
    login:
      ui_url: http://localhost:3000/kratos/login
      lifespan: 10m
    registration:
      ui_url: http://localhost:3000/kratos/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session
    recovery:
      enabled: true
      ui_url: http://localhost:3000/kratos/recovery
      use: code
    verification:
      enabled: false
    settings:
      ui_url: http://localhost:3000/kratos/settings
    error:
      ui_url: http://localhost:3000/kratos/error

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://mailslurper:1025/?skip_ssl_verify=true

log:
  level: info
  format: json

# secrets.cookie / secrets.cipher are intentionally omitted here — Kratos reads them from the
# SECRETS_COOKIE_0 / SECRETS_CIPHER_0 environment variables (see deploy/compose.yml), so the
# actual secret values never appear in this version-controlled file.
